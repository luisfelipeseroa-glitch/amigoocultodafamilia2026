<style>
:root{
  --noite:#1F3A2B; --noite-2:#2D4F3A; --lampada:#FFC857; --coral:#D2693A; --menta:#8DB86B;
  --botao:#B9522E; --botao-escuro:#963F20; --papel:#F6EFD9; --branco:#FFFFFF; --tinta:#2A2418;
  --suave:#6E6446; --linha:#E3D8B8; --ok:#2F7A3E;
  --titulo:'Bricolage Grotesque',Georgia,serif; --texto:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font:400 16px/1.55 var(--texto);min-height:100vh}
h1,h2,h3{font-family:var(--titulo);line-height:1.1;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(2.1rem,7vw,3.6rem);font-weight:800}
h2{font-size:clamp(1.5rem,4.5vw,2rem);font-weight:700}
h3{font-size:1.2rem;font-weight:700}
p{margin:0 0 .8em}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.suave{color:var(--suave)}
.oculto{display:none!important}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:2px solid transparent;border-radius:999px;
  padding:.8em 1.4em;font-weight:700;background:var(--noite);color:#fff;text-decoration:none;line-height:1.1;min-height:48px;transition:transform .12s,background .12s}
.btn:hover{background:var(--noite-2)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-lampada{background:var(--lampada);color:var(--noite)}
.btn-lampada:hover{background:#FFD479}
.btn-perigo{background:var(--botao)}
.btn-perigo:hover{background:var(--botao-escuro)}
.btn-borda{background:transparent;color:var(--noite);border-color:var(--noite)}
.btn-borda:hover{background:rgba(31,58,43,.08)}
.btn-grande{font-size:1.1rem;padding:1em 1.8em;min-height:56px}
.btn-pequeno{padding:.5em 1em;min-height:38px;font-size:.9rem}
.btn-link{background:none;border:0;padding:.5em;text-decoration:underline;font-weight:600;color:inherit}

/* ---------- abertura ---------- */
.abertura{background:var(--noite);color:#fff;min-height:100vh;position:relative;overflow:hidden;display:flex;flex-direction:column}
.abertura::before{content:"";position:absolute;inset:0;background:radial-gradient(1200px 500px at 50% -10%,rgba(156,199,122,.28),transparent 60%);pointer-events:none}
.luzes-faixa{display:flex;justify-content:center;overflow:hidden;position:relative;height:62px}
.luzes{flex:none;height:62px;width:auto;display:block}
.bulbo{animation:pisca 2.6s ease-in-out infinite}
@keyframes pisca{0%,100%{opacity:1}50%{opacity:.3}}
.cena{position:absolute;left:0;right:0;top:0;aspect-ratio:16/9;overflow:hidden;pointer-events:none;z-index:0;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent),linear-gradient(to bottom,transparent,#000 8%,#000 68%,transparent 100%);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent),linear-gradient(to bottom,transparent,#000 8%,#000 68%,transparent 100%);mask-composite:intersect}
.cena img{width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block;opacity:.58;filter:saturate(.88) brightness(.92)}
.cena::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(31,58,43,.22),rgba(31,58,43,0) 65%)}
.abertura .luzes-faixa{z-index:2}
.abertura-miolo{position:relative;z-index:1;flex:1;width:100%;max-width:980px;margin:0 auto;padding:clamp(190px,56vw,230px) 22px 24px;display:grid;gap:20px;align-content:start}
.abertura h1,.abertura .festa-info,.abertura .lead{text-shadow:0 2px 14px rgba(15,32,22,.9),0 0 3px rgba(15,32,22,.6)}
.folhas{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.folha{position:absolute;top:-30px;width:var(--s);height:var(--s);opacity:.8;animation:cair var(--d) linear var(--a) infinite}
@keyframes cair{0%{transform:translate(0,-30px) rotate(0)}50%{transform:translate(28px,50vh) rotate(180deg)}100%{transform:translate(-14px,105vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.folha{animation:none;top:var(--t)}}
.rev-grade{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.rev-par{background:#fff;border:2px solid var(--linha);border-radius:18px;padding:14px;display:flex;align-items:center;gap:10px;justify-content:space-between;text-align:center}
.rev-lado{display:grid;gap:6px;justify-items:center;flex:1;min-width:0;font-weight:700;font-size:.92rem}
.rev-lado img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--lampada)}
.rev-seta{font-size:1.5rem;color:var(--coral)}
.rev-carta{width:100%;border:0;background:var(--noite);color:#fff;border-radius:14px;padding:18px 6px;font:700 1.6rem var(--titulo);cursor:pointer}
.rev-aberta{animation:vira .6s ease}
@keyframes vira{from{transform:rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
.nota-foto{font-size:.78rem;line-height:1.45;color:#CFC49B;max-width:44ch;margin:2px 0 0;text-shadow:0 1px 8px rgba(15,32,22,.8)}
.abertura .lead{font-size:1.15rem;color:#EFE5C2;max-width:34ch}
.festa-info{margin:0;font-size:1.05rem}
.festa-info b{display:block;font-family:var(--titulo);font-size:1.35rem}
.acoes{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.abertura .btn-link{color:#fff}
.avatares{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.avatares .pilha{display:flex}
.avatares .pilha img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--noite);margin-left:-10px;background:#fff}
.avatares .pilha img:first-child{margin-left:0}
.rodape-mini{position:relative;z-index:1;padding:12px 22px calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;color:#CFC49B;font-size:.85rem;max-width:980px;width:100%;margin:0 auto}
.rodape-mini .btn-link{color:#CFC49B;font-size:.85rem}
@media(min-width:760px){
  .cena{top:0;left:0;right:0;width:auto;height:100%;aspect-ratio:auto;
    -webkit-mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent),linear-gradient(to bottom,transparent,#000 11%,#000 80%,transparent);
    -webkit-mask-composite:source-in;
    mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent),linear-gradient(to bottom,transparent,#000 11%,#000 80%,transparent);mask-composite:intersect}
  .cena img{object-position:50% 40%}
  .cena::after{background:linear-gradient(90deg,rgba(31,58,43,.5),rgba(31,58,43,.18) 48%,rgba(31,58,43,0) 70%)}
  .abertura-miolo{grid-template-columns:minmax(0,520px);padding-top:70px;align-content:center}
}

/* ---------- páginas internas ---------- */
.barra{background:var(--noite);color:#fff;position:sticky;top:0;z-index:20}
.barra .luzes-faixa,.barra .luzes{height:32px}
.barra-linha{max-width:680px;margin:0 auto;padding:8px 16px 12px;display:flex;align-items:center;gap:12px}
.barra-linha .quem{flex:1;min-width:0}
.barra-linha .quem b{display:block;font-family:var(--titulo);font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  function juntarFrases(f) {
    var l = f.map(function (x, i) { return i === 0 ? x : x.charAt(0).toLowerCase() + x.slice(1); });
    if (l.length <= 1) return l.join('');
    return l.slice(0, -1).join(', ') + ' e ' + l[l.length - 1];
  }

  function configPublica(s) {
    var c = s.config;
    return {
      titulo: c.titulo, saudacao: c.saudacao, organizador: c.organizador,
      dataSorteio: c.dataSorteio, evento: c.evento, valorSugerido: c.valorSugerido,
      capa: c.capa, notaFoto: c.notaFoto === undefined ? NOTA_FOTO : c.notaFoto, fase: c.fase, modos: c.modos, revelado: s.revelado, revelacao: !!(s.revelacao && s.sorteio),
      total: s.ordem.length
    };
  }

  function visaoAmigo(p) {
    return {
      id: p.id, nome: p.nome, foto: p.foto, nascimento: p.nascimento,
      tracos: p.tracos, frases: frasesTracos(p.tracos), presentes: p.presentes
    };
  }

  function visaoPropria(p) {
    return {
      id: p.id, token: p.token, nome: p.nome, foto: p.foto, nascimento: p.nascimento,
      telefone: p.telefone, email: p.email, tracos: p.tracos, presentes: p.presentes,
      assinatura: p.assinatura || ''
    };
  }

  function porToken(s, token) {
    if (!token) return null;
    for (var i = 0; i < s.ordem.length; i++) {
      var p = s.pessoas[s.ordem[i]];
      if (p && p.token === token) return p;
    }
    return null;
  }

  function exigirPessoa(s, req) {
    var p = porToken(s, str(req.token, 80));
    if (!p) erro('Link inválido ou expirado. Peça um novo link na tela inicial.');
    return p;
  }

  /* ---------- validação de dados da pessoa ---------- */
  function limparTracos(t) {
    var out = {};
    if (!t || typeof t !== 'object') return out;
    Object.keys(OPCOES).forEach(function (k) {
      if (t[k] && OPCOES[k].indexOf(t[k]) >= 0) out[k] = t[k];
    });
    if (t.extra) out.extra = str(t.extra, 80);
    return out;
  }

  // A rubrica é opcional: um desenho pequeno (PNG ou JPEG) feito no próprio app.
  function limparAssinatura(a) {
    if (!a) return '';
    if (!imgOk(a, 60000)) erro('A rubrica ficou grande demais. Limpe e desenhe de novo, com traços simples.');
    return a;
  }

  function limparPresentes(lista) {
    var out = [];
    if (!Array.isArray(lista)) return out;
    for (var i = 0; i < lista.length && out.length < 3; i++) {
      var g = lista[i] || {};
      var nome = str(g.nome, 60);
      if (!nome) continue;
      var item = { nome: nome, foto: '', tamanho: str(g.tamanho, 20), link: '' };
      if (g.foto) {
        if (!imgOk(g.foto, 90000)) erro('A foto do presente "' + nome + '" ficou grande demais. Tente outra imagem.');
        item.foto = g.foto;
      }
      var link = str(g.link, 300);
      if (link) {
        if (!/^https?:\/\//i.test(link)) link = 'https://' + link;
        if (!urlOk(link)) erro('O link do presente "' + nome + '" não parece válido.');
        item.link = link;
      }
      out.push(item);
    }
    return out;
  }

  function validarContato(req, s, ignorarId) {
    var nome = str(req.nome, 60);
    if (nome.length < 2) erro('Digite seu nome.');
    var nasc = str(req.nascimento, 10);
    if (!dataOk(nasc)) erro('Informe uma data de aniversário válida.');
    var fone = str(req.telefone, 25);
    if (fone.replace(/\D/g, '').length < 8) erro('Informe um telefone com DDD.');
    if (!imgOk(req.foto, 60000)) erro('Escolha uma foto sua.');
    return { nome: nome, nascimento: nasc, telefone: fone, foto: req.foto };
  }

  /* ---------- e-mails ---------- */
  function linkPessoal(s, p, baseUrl) {
    var base = s.config.appUrl || baseUrl || '';
    if (!base) return '';
    return base + (base.indexOf('?') >= 0 ? '&' : '?') + 't=' + p.token;
  }

  function emailHtml(titulo, paragrafos, botao, url, rodape) {
    var h = '<div style="font-family:Arial,Helvetica,sans-serif;background:#F6EFD9;padding:24px">' +
      '<div style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:14px;overflow:hidden">' +
      '<div style="background:#1F3A2B;color:#ffffff;padding:22px 24px">' +
      '<div style="font-size:22px;font-weight:bold">' + esc(titulo) + '</div></div>' +
      '<div style="padding:22px 24px;color:#1b2440;font-size:15px;line-height:1.55">';
    paragrafos.forEach(function (t) { h += '<p style="margin:0 0 14px">' + t + '</p>'; });
    if (botao && url) {
      h += '<p style="margin:22px 0"><a href="' + esc(url) + '" style="background:#D2693A;color:#ffffff;text-decoration:none;' +
        'padding:13px 22px;border-radius:999px;font-weight:bold;display:inline-block">' + esc(botao) + '</a></p>';
      h += '<p style="margin:0 0 14px;font-size:13px;color:#5b6483">Este link é só seu. Não encaminhe para ninguém, ou a surpresa vai embora.</p>';
    }
    h += '<p style="margin:18px 0 0;font-size:13px;color:#5b6483">' + esc(rodape || '') + '</p></div></div></div>';
    return h;
  }

  function dadosFesta(s) {
    var e = s.config.evento;
    return diaSemana(e.data) + ', ' + fmtBR(e.data) + ' às ' + e.hora + ' · ' + e.local + ' · ' + e.endereco;
  }

  function emailCadastro(s, p, baseUrl) {
    var url = linkPessoal(s, p, baseUrl);
    return {
      to: p.email,
      subject: 'Seu cadastro no ' + s.config.titulo + ' foi recebido',
      html: emailHtml(s.config.titulo, [
        'Oi, ' + esc(p.nome.split(' ')[0]) + '! Seu cadastro está feito.',
        'Agora é só esperar todo mundo entrar. O sorteio será em <b>' + esc(fmtBR(s.config.dataSorteio)) + '</b> e você receberá outro e-mail avisando.',
        'Enquanto isso, use o seu link pessoal para indicar até 3 presentes que você gostaria de ganhar e completar suas características.',
        '<b>A festa:</b> ' + esc(dadosFesta(s))
      ], 'Abrir meu espaço', url, 'Enviado por ' + s.config.organizador)
    };
  }

  function emailAviso(s, p) {
    var url = linkPessoal(s, p);
    return {
      to: p.email,
      subject: 'Inscrições encerradas: o sorteio será em ' + fmtBR(s.config.dataSorteio),
      html: emailHtml(s.config.titulo, [
        'Oi, ' + esc(p.nome.split(' ')[0]) + '! Todo mundo já se cadastrou e as inscrições foram encerradas.',
        'O sorteio acontece em <b>' + esc(fmtBR(s.config.dataSorteio)) + '</b>. Até lá, confira seus 3 presentes e suas características no seu link pessoal. Quem tirar você vai usar essas informações.',
        '<b>A festa:</b> ' + esc(dadosFesta(s))
      ], 'Abrir meu espaço', url, 'Enviado por ' + s.config.organizador)
    };
  }

  function emailSorteio(s, p) {
    var url = linkPessoal(s, p);
    return {
      to: p.email,
      subject: 'O sorteio foi feito! Descubra quem você tirou',
      html: emailHtml(s.config.titulo, [
        'Oi, ' + esc(p.nome.split(' ')[0]) + '! O sorteio foi realizado.',
        'Abra o seu link pessoal para descobrir quem você tirou, ver as características e a lista de presentes. Guarde segredo até a noite de Natal.',
        '<b>A festa:</b> ' + esc(dadosFesta(s))
      ], 'Descobrir meu amigo oculto', url, 'Enviado por ' + s.config.organizador)
    };
  }

  function emailLink(s, p, baseUrl) {
    var url = linkPessoal(s, p, baseUrl);
    return {
      to: p.email,
      subject: 'Seu link pessoal: ' + s.config.titulo,
      html: emailHtml(s.config.titulo, [
        'Oi, ' + esc(p.nome.split(' ')[0]) + '! Aqui está o seu link pessoal para entrar de novo.'
      ], 'Abrir meu espaço', url, 'Enviado por ' + s.config.organizador)
    };
  }

  /* ---------- sorteio ---------- */
  // Sorteia uma permutação sem ponto fixo (ninguém tira a si mesmo) e sem repetição
  // (cada pessoa é tirada exatamente uma vez). "proibidos" bloqueia pares específicos.
  function derrangement(ids, proibidos) {
    for (var tent = 0; tent < 20000; tent++) {
      var perm = embaralhar(ids);
      var ok = true;
      for (var i = 0; i < ids.length; i++) {
        if (ids[i] === perm[i] || (proibidos && proibidos[ids[i]] && proibidos[ids[i]][perm[i]])) { ok = false; break; }
      }
      if (ok) {
        var m = {};
        for (var k = 0; k < ids.length; k++) m[ids[k]] = perm[k];
        return m;
      }
    }
    return null;
  }

  function validarSorteio(ids, m) {
    var vistos = {};
    ids.forEach(function (id) {
      var alvo = m[id];
      if (!alvo || alvo === id) erro('Falha de segurança no sorteio. Nada foi salvo.');
      if (vistos[alvo]) erro('Falha de segurança no sorteio. Nada foi salvo.');
      vistos[alvo] = true;
    });
    if (Object.keys(vistos).length !== ids.length) erro('Falha de segurança no sorteio. Nada foi salvo.');
  }

  function sortearInimigo(s) {
    var ids = s.ordem.slice();
    var proib = {};
    ids.forEach(function (id) { proib[id] = {}; proib[id][s.sorteio.amigo[id]] = true; });
    var m = derrangement(ids, proib);
    if (!m) erro('Não foi possível sortear o inimigo oculto diferente do amigo oculto com esses participantes.');
    validarSorteio(ids, m);
    var missoes = embaralhar(MISSOES);
    var out = {};
    ids.forEach(function (id, i) { out[id] = { alvo: m[id], missao: missoes[i % missoes.length] }; });
    s.sorteio.inimigo = out;
  }

  function fazerSorteio(s, ctx) {
    var ids = s.ordem.slice();
    if (ids.length < 3) erro('São necessários pelo menos 3 participantes para sortear.');
    var m = derrangement(ids, null);
    if (!m) erro('Não foi possível sortear. Tente novamente.');
    validarSorteio(ids, m);
    s.sorteio = { amigo: m, inimigo: null, feitoEm: ctx.agora() };
    s.config.fase = 'sorteado';
    if (s.config.modos.inimigo) sortearInimigo(s);
  }

  /* ---------- mural de pistas ---------- */
  function muralVista(s, eu) {
    var porId = function (id) { return s.pessoas[id] ? pub(s.pessoas[id]) : null; };
    return s.pistas.filter(function (p) { return p.alvoId !== eu.id; }).map(function (p) {
      var palp = null;
      for (var i = 0; i < s.palpites.length; i++) {
        if (s.palpites[i].pessoaId === eu.id && s.palpites[i].pistaId === p.id) palp = s.palpites[i];
      }
      var v = {
        id: p.id, texto: p.texto, minha: p.autorId === eu.id,
        suspeitos: p.suspeitos.map(porId).filter(Boolean),
        palpite: palp ? { escolhaId: palp.escolhaId, acertou: palp.acertou } : null
      };
      if (v.minha || s.revelado) { v.autor = porId(p.autorId); v.alvo = porId(p.alvoId); }
      return v;
    });
  }

  function ranking(s) {
    var pontos = {};
    s.palpites.forEach(function (x) { if (x.acertou) pontos[x.pessoaId] = (pontos[x.pessoaId] || 0) + 1; });
    return Object.keys(pontos).map(function (id) {
      return s.pessoas[id] ? { pessoa: pub(s.pessoas[id]), pontos: pontos[id] } : null;
    }).filter(Boolean).sort(function (a, b) { return b.pontos - a.pontos; }).slice(0, 10);
  }

  /* ---------- roubo de presentes ---------- */
  function rouboAvancar(r) {
    r.proibido = null;
    if (r.fila.length) { r.vezId = r.fila.shift(); } else { r.vezId = null; r.fim = true; }
  }

  function rouboIniciar(s) {
    var ids = embaralhar(s.ordem);
    if (ids.length < 2) erro('É preciso ter pelo menos 2 participantes.');
    var presentes = [];
    for (var i = 1; i <= ids.length; i++) presentes.push({ num: i, dono: null, descricao: '', roubos: 0 });
    s.roubo = { ordem: ids.slice(), fila: ids.slice(1), vezId: ids[0], presentes: presentes, log: [], fim: false, proibido: null, maxRoubos: 2 };
  }

  function rouboAgir(s, req) {
    var r = s.roubo;
    if (!r || r.fim) erro('O jogo não está em andamento.');
    var num = parseInt(req.num, 10);
    var pr = null;
    r.presentes.forEach(function (x) { if (x.num === num) pr = x; });
    if (!pr) erro('Presente não encontrado.');
    var vez = r.vezId;
    var nomeVez = s.pessoas[vez] ? s.pessoas[vez].nome : '?';
    if (req.tipo === 'abrir') {
      if (pr.dono) erro('Esse presente já foi aberto.');
      pr.dono = vez;
      pr.descricao = str(req.descricao, 60) || 'Presente ' + num;
      r.log.unshift(nomeVez + ' abriu o presente ' + num + ': ' + pr.descricao);
      rouboAvancar(r);
    } else if (req.tipo === 'roubar') {
      if (!pr.dono) erro('Esse presente ainda está fechado.');
      if (pr.dono === vez) erro('Esse presente já é seu.');
      if (pr.roubos >= r.maxRoubos) erro('Esse presente já foi roubado ' + r.maxRoubos + ' vezes e está travado.');
      if (r.proibido === pr.num) erro('Não vale roubar de volta na mesma jogada.');
      var vitima = pr.dono;
      pr.dono = vez;
      pr.roubos += 1;
      r.log.unshift(nomeVez + ' roubou o presente ' + num + ' (' + pr.descricao + ') de ' + (s.pessoas[vitima] ? s.pessoas[vitima].nome : '?'));
      r.vezId = vitima;
      r.proibido = pr.num;
    } else {
      erro('Ação inválida.');
    }
  }

  /* ---------- ações ---------- */
  var H = {};

  H.publico = function (s) {
    return {
      config: configPublica(s),
      pessoas: s.ordem.map(function (id) { return { id: id, nome: s.pessoas[id].nome.split(' ')[0], foto: s.pessoas[id].foto }; })
    };
  };

  H.cadastrar = function (s, req, ctx, out) {
    if (s.config.fase !== 'inscricoes') erro('As inscrições estão encerradas. Fale com o organizador.');
    if (s.ordem.length >= MAX_PESSOAS) erro('O limite de participantes foi atingido.');
    var base = validarContato(req, s);
    var email = str(req.email, 120).toLowerCase();
    if (!emailOk(email)) erro('Informe um e-mail válido.');
    for (var i = 0; i < s.ordem.length; i++) {
      if (s.pessoas[s.ordem[i]].email === email) erro('Este e-mail já está cadastrado. Use "Já me cadastrei" para receber seu link.');
    }
    var id = 'p' + ctx.uuid().replace(/-/g, '').slice(0, 10);
    var p = {
      id: id, token: ctx.uuid().replace(/-/g, ''), nome: base.nome, foto: base.foto,
      nascimento: base.nascimento, telefone: base.telefone, email: email,
      tracos: limparTracos(req.tracos), presentes: limparPresentes(req.presentes),
      assinatura: limparAssinatura(req.assinatura), criadoEm: ctx.agora()
    };
    s.pessoas[id] = p;
    s.ordem.push(id);
    out.mudou = true;
    var baseUrl = str(req.baseUrl, 300);
    if (!urlOk(baseUrl)) baseUrl = '';
    out.outbox.push(emailCadastro(s, p, baseUrl));
    return { token: p.token };
  };

  H.reenviarLink = function (s, req, ctx, out) {
    var email = str(req.email, 120).toLowerCase();
    if (!emailOk(email)) erro('Informe o e-mail que você usou no cadastro.');
    for (var i = 0; i < s.ordem.length; i++) {
      var p = s.pessoas[s.ordem[i]];
      if (p.email === email) { out.outbox.push(emailLink(s, p)); break; }
    }
    return { enviado: true };
  };

  H.eu = function (s, req) {
    var p = exigirPessoa(s, req);
    var d = {
      eu: visaoPropria(p),
      config: configPublica(s),
      participantes: s.ordem.map(function (id) {
        var x = s.pessoas[id];
        return { id: id, nome: x.nome, foto: x.foto, nascimento: x.nascimento, presentes: x.presentes.length, assinatura: x.assinatura || '' };
      }),
      amigo: null, inimigo: null, ranking: [], minhasPistas: 0
    };
    if (s.sorteio && s.sorteio.amigo[p.id] && s.pessoas[s.sorteio.amigo[p.id]]) {
      d.amigo = visaoAmigo(s.pessoas[s.sorteio.amigo[p.id]]);
      d.ranking = ranking(s);
      d.minhasPistas = s.pistas.filter(function (x) { return x.autorId === p.id; }).length;
      d.maxPistas = MAX_PISTAS;
    }
    if (s.sorteio && s.sorteio.inimigo && s.config.modos.inimigo && s.sorteio.inimigo[p.id]) {
      var im = s.sorteio.inimigo[p.id];
      if (s.pessoas[im.alvo]) d.inimigo = { pessoa: pub(s.pessoas[im.alvo]), missao: im.missao };
    }
    return d;
  };

  H.salvarPerfil = function (s, req, ctx, out) {
    var p = exigirPessoa(s, req);
    if (req.perfil) {
      var b = validarContato({
        nome: req.perfil.nome, nascimento: req.perfil.nascimento,
        telefone: req.perfil.telefone, foto: req.perfil.foto || p.foto
      }, s);
      p.nome = b.nome; p.nascimento = b.nascimento; p.telefone = b.telefone; p.foto = b.foto;
      p.tracos = limparTracos(req.perfil.tracos);
      if (req.perfil.assinatura !== undefined) p.assinatura = limparAssinatura(req.perfil.assinatura);
    }
    if (req.presentes) p.presentes = limparPresentes(req.presentes);
    out.mudou = true;
    return { salvo: true };
  };

  H.sugerirDespiste = function (s, req) {
    var p = exigirPessoa(s, req);
    if (!s.sorteio) erro('O sorteio ainda não foi feito.');
    var meuAmigo = s.sorteio.amigo[p.id];
    var cand = s.ordem.filter(function (id) {
      return id !== p.id && id !== meuAmigo && frasesTracos(s.pessoas[id].tracos).length >= 2;
    });
    if (!cand.length) erro('Ainda faltam características cadastradas de outros participantes para montar um despiste.');
    var alvo = s.pessoas[cand[Math.floor(Math.random() * cand.length)]];
    var f = embaralhar(frasesTracos(alvo.tracos)).slice(0, 3);
    return { alvoId: alvo.id, nome: alvo.nome, texto: juntarFrases(f) };
  };

  H.postarPista = function (s, req, ctx, out) {
    var p = exigirPessoa(s, req);
    if (!s.sorteio) erro('O sorteio ainda não foi feito.');
    var texto = str(req.texto, 140);
    if (texto.length < 8) erro('Escreva uma pista com pelo menos 8 letras.');
    var minhas = s.pistas.filter(function (x) { return x.autorId === p.id; }).length;
    if (minhas >= MAX_PISTAS) erro('Você já postou ' + MAX_PISTAS + ' pistas.');
    var meuAmigo = s.sorteio.amigo[p.id];
    var alvoId = meuAmigo;
    if (req.despiste) {
      alvoId = str(req.alvoId, 40);
      if (!s.pessoas[alvoId] || alvoId === p.id || alvoId === meuAmigo) erro('Pessoa inválida para o despiste.');
    }
    var outros = embaralhar(s.ordem.filter(function (id) { return id !== p.id && id !== alvoId; })).slice(0, 2);
    var suspeitos = embaralhar([p.id].concat(outros));
    s.pistas.push({
      id: 'k' + ctx.uuid().replace(/-/g, '').slice(0, 8), autorId: p.id, alvoId: alvoId,
      texto: texto, suspeitos: suspeitos, criadoEm: ctx.agora()
    });
    out.mudou = true;
    return { postado: true };
  };

  H.mural = function (s, req) {
    var p = exigirPessoa(s, req);
    if (!s.sorteio) erro('O mural abre depois do sorteio.');
    return { pistas: muralVista(s, p), ranking: ranking(s), revelado: s.revelado };
  };

  H.palpitar = function (s, req, ctx, out) {
    var p = exigirPessoa(s, req);
    var pista = null;
    s.pistas.forEach(function (x) { if (x.id === req.pistaId) pista = x; });
    if (!pista) erro('Pista não encontrada.');
    if (pista.autorId === p.id || pista.alvoId === p.id) erro('Você não pode palpitar nessa pista.');
    var ja = s.palpites.filter(function (x) { return x.pessoaId === p.id && x.pistaId === pista.id; });
    if (ja.length) erro('Você já deu seu palpite nessa pista.');
    var escolha = str(req.escolhaId, 40);
    if (!s.pessoas[escolha]) erro('Escolha uma pessoa.');
    var acertou = escolha === pista.alvoId;
    s.palpites.push({ pessoaId: p.id, pistaId: pista.id, escolhaId: escolha, acertou: acertou });
    out.mudou = true;
    return { acertou: acertou };
  };

  /* ----- organizador ----- */
  function exigirAdmin(s, req, ctx) {
    var agoraMs = ctx.ms();
    if (s.seg.ate && agoraMs < s.seg.ate) erro('Muitas tentativas erradas. Aguarde alguns minutos.');
    if (!s.config.pin) erro('Crie a senha do organizador primeiro.');
    if (req.pin !== s.config.pin) {
      s.seg.falhas += 1;
      if (s.seg.falhas >= 5) { s.seg.ate = agoraMs + 5 * 60 * 1000; s.seg.falhas = 0; }
      var e = new Error('Senha do organizador incorreta.'); e.amigavel = true; e.gravar = true; throw e;
    }
    s.seg.falhas = 0; s.seg.ate = 0;
  }

  H.adminEstado = function (s) { return { temPin: !!s.config.pin }; };

  H.adminCriarPin = function (s, req, ctx, out) {
    if (s.config.pin) erro('A senha do organizador já foi criada.');
    var pin = str(req.pin, 60);
    if (pin.length < 6) erro('Use uma senha com pelo menos 6 caracteres.');
    s.config.pin = pin;
    out.mudou = true;
    return { ok: true };
  };

  H.adminDados = function (s, req, ctx) {
    exigirAdmin(s, req, ctx);
    var pessoas = s.ordem.map(function (id) {
      var p = s.pessoas[id];
      return {
        id: id, nome: p.nome, foto: p.foto, email: p.email, telefone: p.telefone, nascimento: p.nascimento,
        presentes: p.presentes.length, tracos: frasesTracos(p.tracos).length, link: linkPessoal(s, p),
        assinou: !!p.assinatura
      };
    });
    var cfg = JSON.parse(JSON.stringify(s.config));
    delete cfg.pin;
    cfg.notaFoto = configPublica(s).notaFoto;
    return {
      config: cfg, pessoas: pessoas, sorteado: !!s.sorteio, temInimigo: !!(s.sorteio && s.sorteio.inimigo), revelado: s.revelado, revelacao: !!s.revelacao,
      pistas: s.pistas.length, palpites: s.palpites.length, roubo: s.roubo
    };
  };

  H.adminConfig = function (s, req, ctx, out) {
    exigirAdmin(s, req, ctx);
    var c = req.config || {};
    var cf = s.config;
    if (c.titulo !== undefined) cf.titulo = str(c.titulo, 80) || cf.titulo;
    if (c.saudacao !== undefined) cf.saudacao = str(c.saudacao, 300);
    if (c.organizador !== undefined) cf.organizador = str(c.organizador, 40) || cf.organizador;
    if (c.dataSorteio !== undefined) {
      if (!dataOk(c.dataSorteio)) erro('Data do sorteio inválida.');
      cf.dataSorteio = c.dataSorteio;
    }
    if (c.valorSugerido !== undefined) cf.valorSugerido = str(c.valorSugerido, 40);
    if (c.notaFoto !== undefined) cf.notaFoto = str(c.notaFoto, 200);
    if (c.appUrl !== undefined) {
      var u = str(c.appUrl, 300);
      if (u && !urlOk(u)) erro('O endereço do app precisa começar com https://');
      cf.appUrl = u;
    }
    if (c.capa !== undefined) {
      if (c.capa && !imgOk(c.capa, 200000)) erro('A foto de capa ficou grande demais.');
      cf.capa = c.capa || '';
    }
    if (c.evento) {
      var e = c.evento;
      if (e.data !== undefined) { if (!dataOk(e.data)) erro('Data da festa inválida.'); cf.evento.data = e.data; }
      if (e.hora !== undefined) { if (!/^\d{2}:\d{2}$/.test(e.hora)) erro('Hora da festa inválida.'); cf.evento.hora = e.hora; }
      if (e.local !== undefined) cf.evento.local = str(e.local, 80);
      if (e.endereco !== undefined) cf.evento.endereco = str(e.endereco, 200);
    }
    if (c.modos) {
      if (c.modos.inimigo !== undefined) {
        cf.modos.inimigo = !!c.modos.inimigo;
        if (cf.modos.inimigo && s.sorteio && !s.sorteio.inimigo) sortearInimigo(s);
      }
      if (c.modos.roubo !== undefined) cf.modos.roubo = !!c.modos.roubo;
    }
    out.mudou = true;
    return { salvo: true };
  };

  H.adminAvisar = function (s, req, ctx, out) {
    exigirAdmin(s, req, ctx);
    if (s.sorteio) erro('O sorteio já foi feito.');
    if (!s.config.appUrl) erro('Defina o endereço do app em Configurações antes de avisar todo mundo.');
    if (s.ordem.length < 3) erro('Cadastre pelo menos 3 participantes antes de encerrar as inscrições.');
    s.config.fase = 'aguardando';
    s.ordem.forEach(function (id) { out.outbox.push(emailAviso(s, s.pessoas[id])); });

    return { avisados: s.ordem.length };
  };

  H.adminReabrir = function (s, req, ctx, out) {
    exigirAdmin(s, req, ctx);
    if (s.sorteio) erro('Depois do sorteio não dá para reabrir as inscrições. Desfaça o sorteio primeiro.');
    s.config.fase = 'inscricoes';
    out.mudou = true;
    return { ok: true };
  };

  H.adminSortear = function (s, req, ctx, out) {
    exigirAdmin(s, req, ctx);
    if (s.sorteio) erro('O sorteio já foi feito. Para refazer, desfaça o sorteio primeiro.');
    if (!s.config.appUrl) erro('Defina o endereço do app em Configurações antes de sortear.');
    fazerSorteio(s, ctx);
    s.ordem.forEach(function (id) { out.outbox.push(emailSorteio(s, s.pessoas[id])); });
    out.mudou = true;
    return { sorteados: s.ordem.length };
  };

  H.adminDesfazerSorteio = function (s, req, ctx, out) {
    exigirAdmin(s, req, ctx);
    s.sorteio = null; s.pistas = []; s.palpites = []; s.roubo = null; s.revelado = false; s.revelacao = false;
    s.config.fase = 'aguardando';
    out.mudou = true;
    return { ok: true };
  };

  H.adminRemover = function (s, req, ctx, out) {
    exigirAdmin(s, req, ctx);
    if (s.sorteio) erro('Desfaça o sorteio antes de remover alguém.');
    var id = str(req.id, 40);
    if (!s.pessoas[id]) erro('Participante não encontrado.');
    delete s.pessoas[id];
    s.ordem = s.ordem.filter(function (x) { return x !== id; });
    out.mudou = true;
    return { ok: true };
  };

  H.adminReenviar = function (s, req, ctx, out) {
    exigirAdmin(s, req, ctx);
    var p = s.pessoas[str(req.id, 40)];
    if (!p) erro('Participante não encontrado.');
    out.outbox.push(emailLink(s, p));
    return { ok: true };
  };

  // Página de revelação: só existe depois que o organizador libera (use depois da festa).
  H.revelacao = function (s) {
    if (!s.sorteio || !s.revelacao) erro('A revelação ainda não foi liberada. Aguarde o organizador.');
    function par(de, para) { return { de: pub(s.pessoas[de]), para: pub(s.pessoas[para]) }; }
    var amigos = s.ordem.filter(function (id) { return s.pessoas[id] && s.pessoas[s.sorteio.amigo[id]]; })
      .map(function (id) { return par(id, s.sorteio.amigo[id]); });
    var inimigos = [];
    if (s.config.modos.inimigo && s.sorteio.inimigo) {
      inimigos = s.ordem.filter(function (id) { return s.pessoas[id] && s.pessoas[s.sorteio.inimigo[id]]; })
        .map(function (id) { return par(id, s.sorteio.inimigo[id]); });
    }
    return { titulo: s.config.titulo, amigos: amigos, inimigos: inimigos };
  };

  H.adminRevelacao = function (s, req, ctx, out) {
    exigirAdmin(s, req, ctx);
    if (req.valor && !s.sorteio) erro('Faça o sorteio antes de liberar a revelação.');
    s.revelacao = !!req.valor;
    out.mudou = true;
    return { revelacao: s.revelacao };
  };

  H.adminRevelar = function (s, req, ctx, out) {
    exigirAdmin(s, req, ctx);
    s.revelado = !!req.valor;
    out.mudou = true;
    return { revelado: s.revelado };
  };

  H.adminRouboIniciar = function (s, req, ctx, out) {
    exigirAdmin(s, req, ctx);
    rouboIniciar(s);
    out.mudou = true;
    return { ok: true };
  };

  H.adminRouboAgir = function (s, req, ctx, out) {
    exigirAdmin(s, req, ctx);
    rouboAgir(s, req);
    out.mudou = true;
    return { ok: true };
  };

  H.adminRouboEncerrar = function (s, req, ctx, out) {
    exigirAdmin(s, req, ctx);
    if (s.roubo) { s.roubo.fim = true; s.roubo.vezId = null; }
    out.mudou = true;
    return { ok: true };
  };

  H.adminRouboReiniciar = function (s, req, ctx, out) {
    exigirAdmin(s, req, ctx);
    s.roubo = null;
    out.mudou = true;
    return { ok: true };
  };

  /* ---------- ponto de entrada ---------- */
  function handle(s, req, ctx) {
    var out = { mudou: false, outbox: [] };
    try {
      var fn = H[req && req.action];
      if (!fn) erro('Ação desconhecida.');
      var data = fn(s, req, ctx, out);
      return { ok: true, data: data, mudou: out.mudou, outbox: out.outbox };
    } catch (e) {
      if (e && e.amigavel) return { ok: false, erro: e.message, mudou: !!e.gravar, outbox: [] };
      return { ok: false, erro: 'Erro inesperado: ' + (e && e.message), mudou: false, outbox: [] };
    }
  }

  // Chamado por um gatilho diário: faz o sorteio na data marcada.
  function tick(s, ctx) {
    var out = { mudou: false, outbox: [] };
    try {
      if (s.config.fase === 'aguardando' && !s.sorteio && s.config.appUrl &&
          ctx.hoje() >= s.config.dataSorteio && s.ordem.length >= 3) {
        fazerSorteio(s, ctx);
        s.ordem.forEach(function (id) { out.outbox.push(emailSorteio(s, s.pessoas[id])); });
        out.mudou = true;
      }
    } catch (e) { /* tenta de novo no próximo dia */ }
    return { ok: true, mudou: out.mudou, outbox: out.outbox };
  }

  // Só para o modo demonstração no navegador.
  function semearDemo(s, ctx) {
    function avatar(letra, cor) {
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="' + cor + '"/>' +
        '<text x="100" y="128" font-family="Arial" font-size="96" font-weight="bold" fill="#fff" text-anchor="middle">' + letra + '</text></svg>';
      return 'data:image/svg+xml;base64,' + btoa(svg);
    }
    function caixa(cor) {
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="#F6EFD9"/>' +
        '<rect x="40" y="80" width="120" height="90" rx="6" fill="' + cor + '"/><rect x="92" y="80" width="16" height="90" fill="#FFC857"/>' +
        '<rect x="34" y="62" width="132" height="26" rx="6" fill="' + cor + '"/><rect x="92" y="62" width="16" height="26" fill="#FFC857"/></svg>';
      return 'data:image/svg+xml;base64,' + btoa(svg);
    }
    var nomes = ['Ana Beatriz', 'Bruno Lima', 'Carla Souza', 'Diego Rocha', 'Elisa Prado', 'Fábio Neves', 'Gabi Torres'];
    var cores = ['#1F3A2B', '#D2693A', '#2F7F6B', '#7A4FB8', '#C7792B', '#2B6CB0', '#B02A55'];
    var cab = ['Castanho', 'Preto', 'Loiro', 'Ruivo', 'Grisalho', 'Castanho', 'Preto'];
    nomes.forEach(function (n, i) {
      var id = 'p' + ctx.uuid().replace(/-/g, '').slice(0, 10);
      s.pessoas[id] = {
        id: id, token: ctx.uuid().replace(/-/g, ''), nome: n, foto: avatar(n.charAt(0), cores[i]),
        nascimento: '19' + (70 + i * 3) + '-0' + (1 + i) + '-1' + i, telefone: '(21) 99999-000' + i,
        email: n.split(' ')[0].toLowerCase().replace(/[^a-z]/g, '') + '@exemplo.com',
        tracos: { cabeloCor: cab[i], cabeloTipo: OPCOES.cabeloTipo[i % 4], cabeloTam: OPCOES.cabeloTam[(i + 1) % 4],
                  olhos: OPCOES.olhos[i % 5], oculos: OPCOES.oculos[i % 2], altura: OPCOES.altura[i % 3], estilo: OPCOES.estilo[i % 5] },
        presentes: [
          { nome: 'Caneca térmica', foto: caixa(cores[i]), tamanho: '', link: 'https://exemplo.com/caneca' },
          { nome: 'Camiseta', foto: caixa('#D2693A'), tamanho: 'M', link: '' }
        ],
        criadoEm: ctx.agora()
      };
      s.ordem.push(id);
    });
  }

  return {
    OPCOES: OPCOES, MAX_PISTAS: MAX_PISTAS,
    novoEstado: novoEstado, handle: handle, tick: tick, semearDemo: semearDemo,
    frasesTracos: frasesTracos, fmtBR: fmtBR, fmtDM: fmtDM, diaSemana: diaSemana,
    _derrangement: derrangement, _validarSorteio: validarSorteio, _fazerSorteio: fazerSorteio
  };
})();

</script>

<script>
(function () {
'use strict';

/* ---------------- armazenamento local (com plano B em memória) ---------------- */
var mem = {};
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] || null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } }

/* ---------------- servidor (real ou demonstração) ---------------- */
var demoCtx = {
  uuid: function () { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function () { return Math.floor(Math.random() * 16).toString(16); }); },
  agora: function () { return new Date().toISOString(); },
  hoje: function () { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); },
  ms: function () { return Date.now(); }
};
function demoLoad() { var raw = lsGet('ao_demo'); if (raw) { try { return JSON.parse(raw); } catch (e) {} } return AO.novoEstado(); }
function demoSave(s) { lsSet('ao_demo', JSON.stringify(s)); }
function demoEmails() { try { return JSON.parse(lsGet('ao_demo_mail') || '[]'); } catch (e) { return []; } }
function demo(req) {
  var s = demoLoad();
  var r = AO.handle(s, req, demoCtx);
  if (r.mudou) demoSave(s);
  if (r.outbox && r.outbox.length) {
    var l = demoEmails();
    r.outbox.forEach(function (m) { l.unshift({ to: m.to, subject: m.subject, html: m.html, quando: new Date().toLocaleString('pt-BR') }); });
    lsSet('ao_demo_mail', JSON.stringify(l.slice(0, 60)));
  }
  return r;
}

async function chamar(action, dados) {
  var req = Object.assign({ action: action }, dados || {});
  var r;
  if (API_URL) {
    var resp;
    try { resp = await fetch(API_URL, { method: 'POST', body: JSON.stringify(req) }); }
    catch (e) { throw new Error('Sem conexão com o servidor. Confira a internet e tente de novo.'); }
    try { r = await resp.json(); } catch (e) { throw new Error('O servidor respondeu algo inesperado. Confira a implantação do Apps Script.'); }
  } else {
    r = demo(req);
  }
  if (!r.ok) throw new Error(r.erro || 'Algo deu errado.');
  if (r.emailsFalharam) aviso('Alguns e-mails não saíram (limite diário do Gmail?). Tente de novo amanhã.', true);
  return r.data;
}

/* ---------------- estado ---------------- */
var S = {
  view: 'carregando', pub: null, eu: null, token: '', tab: 'amigo', jogo: 'mural',
  cad: null, ed: null, mural: null, despiste: null, dicas: null, boasVindas: false,
  adm: { pin: '', temPin: null, dados: null, aba: 'painel', cfg: null }
};

/* ---------------- utilidades ---------------- */
function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function $(sel, el) { return (el || document).querySelector(sel); }
function primeiroNome(n) { return String(n || '').split(' ')[0]; }
function getPath(o, p) { return p.split('.').reduce(function (a, k) { return a == null ? a : a[k]; }, o); }
function setPath(o, p, v) { var ks = p.split('.'); var last = ks.pop(); var t = ks.reduce(function (a, k) { return a[k]; }, o); t[last] = v; }
function diasAte(d) { var p = d.split('-').map(Number); var alvo = new Date(p[0], p[1] - 1, p[2]); var h = new Date(); h = new Date(h.getFullYear(), h.getMonth(), h.getDate()); return Math.round((alvo - h) / 86400000); }
function dataLonga(d) { return AO.diaSemana(d) + ', ' + AO.fmtBR(d); }
function digitos(s) { return String(s || '').replace(/\D/g, ''); }

function aviso(msg, erro) {
  var t = document.createElement('div');
  t.className = 'toast' + (erro ? ' erro-toast' : '');
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(function () { t.remove(); }, erro ? 6000 : 3800);
}

async function rodar(fn) {
  try { await fn(); } catch (e) { aviso(e.message || 'Algo deu errado.', true); }
}

function confirmar(titulo, texto, rotulo, perigo) {
  return new Promise(function (resolve) {
    var box = $('#modais');
    box.innerHTML = '<div class="fundo-modal"><div class="modal" role="dialog" aria-modal="true"><h3>' + esc(titulo) + '</h3><p>' + esc(texto) + '</p>' +
      '<div class="acoes"><button class="btn btn-borda" id="m-nao">Cancelar</button><button class="btn ' + (perigo ? 'btn-perigo' : '') + '" id="m-sim">' + esc(rotulo) + '</button></div></div></div>';
    $('#m-nao').onclick = function () { box.innerHTML = ''; resolve(false); };
    $('#m-sim').onclick = function () { box.innerHTML = ''; resolve(true); };
    $('#m-sim').focus();
  });
}

function pedirTexto(titulo, rotulo, tipo, valor) {
  return new Promise(function (resolve) {
    var box = $('#modais');
    box.innerHTML = '<div class="fundo-modal"><form class="modal" id="m-form"><h3>' + esc(titulo) + '</h3><div class="campo"><label for="m-in">' + esc(rotulo) + '</label>' +
      '<input id="m-in" type="' + (tipo || 'text') + '" value="' + esc(valor || '') + '" maxlength="120" autocomplete="off"></div>' +
      '<div class="acoes"><button type="button" class="btn btn-borda" id="m-nao">Cancelar</button><button type="submit" class="btn">Continuar</button></div></form></div>';
    $('#m-in').focus();
    $('#m-nao').onclick = function () { box.innerHTML = ''; resolve(null); };
    $('#m-form').onsubmit = function (e) { e.preventDefault(); var v = $('#m-in').value; box.innerHTML = ''; resolve(v); };
  });
}

/* ---------------- fotos ---------------- */
var LIMITES = { avatar: { max: 256, quad: true, lim: 50000 }, presente: { max: 480, quad: false, lim: 80000 }, capa: { max: 900, quad: false, lim: 180000 } };
function lerFoto(file, tipo) {
  var cfg = LIMITES[tipo];
  return new Promise(function (resolve, reject) {
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight, sx = 0, sy = 0, sw = w, sh = h, cw, ch;
      if (cfg.quad) { var m = Math.min(w, h); sx = (w - m) / 2; sy = (h - m) / 2; sw = sh = m; cw = ch = Math.min(cfg.max, m); }
      else { var e = Math.min(1, cfg.max / Math.max(w, h)); cw = Math.round(w * e); ch = Math.round(h * e); }
      var c = document.createElement('canvas'); c.width = cw; c.height = ch;
      var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cw, ch); g.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);
      var q = 0.82, d = c.toDataURL('image/jpeg', q);
      while (d.length > cfg.lim && q > 0.3) { q -= 0.08; d = c.toDataURL('image/jpeg', q); }
      URL.revokeObjectURL(url);
      if (d.length > cfg.lim) reject(new Error('Essa foto ficou pesada demais. Tente outra.')); else resolve(d);
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('Não consegui abrir essa imagem. Tente outra foto.')); };
    img.src = url;
  });
}

/* ---------------- confete ---------------- */
function confete() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var c = document.createElement('canvas'); c.className = 'confete';
  c.width = innerWidth; c.height = innerHeight; document.body.appendChild(c);
  var g = c.getContext('2d'), cores = ['#D2693A', '#FFC857', '#8DB86B', '#9CC77A', '#FFFFFF'];
  var ps = []; for (var i = 0; i < 90; i++) ps.push({ x: c.width / 2 + (Math.random() - .5) * 120, y: c.height * .45, vx: (Math.random() - .5) * 12, vy: -Math.random() * 13 - 3, r: 4 + Math.random() * 5, cor: cores[i % 5], rot: Math.random() * 6 });
  var t0 = performance.now();
  (function quadro(t) {
    var dt = t - t0; g.clearRect(0, 0, c.width, c.height);
    ps.forEach(function (p) { p.vy += .35; p.x += p.vx; p.y += p.vy; p.rot += .15; g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillStyle = p.cor; g.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); g.restore(); });
    if (dt < 2200) requestAnimationFrame(quadro); else c.remove();
  })(t0);
}

/* ---------------- pisca-pisca ---------------- */
function folhasHtml() {
  var cs = ['#B9522E', '#D2693A', '#C98A3A', '#8DB86B', '#A8431F', '#D9A441'], o = '';
  for (var i = 0; i < 12; i++) {
    o += '<svg class="folha" viewBox="0 0 24 24" style="left:' + (4 + i * 8) + '%;--s:' + (16 + (i * 7) % 14) + 'px;--d:' + (13 + (i * 5) % 9) + 's;--a:-' + ((i * 3) % 13) + 's;--t:' + (10 + (i * 17) % 70) + '%"><path fill="' + cs[i % cs.length] + '" d="M12 1C6 6 3 11 5 16c1.2 3 4 5 6 7 .2-3 .3-4 1-6 1.6 2 3 3 5 3 3-3 2-9-5-19z"/><path d="M12 22V9" stroke="rgba(0,0,0,.25)" stroke-width="1" fill="none"/></svg>';
  }
  return '<div class="folhas" aria-hidden="true">' + o + '</div>';
}
function telaRevelacao() {
  var R = S.rev, n = R.amigos.length, abertos = Object.keys(R.abertos).length;
  function lista(arr, pref) {
    return '<div class="rev-grade">' + arr.map(function (x, i) {
      var k = pref + i, ab = R.abertos[k];
      return '<div class="rev-par"><div class="rev-lado"><img src="' + esc(x.de.foto) + '" alt=""><span>' + esc(primeiroNome(x.de.nome)) + '</span></div><span class="rev-seta">🎁</span>' +
        '<div class="rev-lado">' + (ab ? '<div class="rev-aberta rev-lado"><img src="' + esc(x.para.foto) + '" alt=""><span>' + esc(primeiroNome(x.para.nome)) + '</span></div>'
        : '<button class="rev-carta" data-act="rev-abrir" data-k="' + k + '" aria-label="Revelar">?</button>') + '</div></div>';
    }).join('') + '</div>';
  }
  var total = n + R.inimigos.length;
  return (S.demoBanner || '') + '<div class="barra">' + luzes() + '<div class="barra-linha"><div class="quem"><b>A grande revelação</b><span>' + esc(R.titulo) + '</span></div><button class="btn btn-pequeno btn-lampada" data-act="home">Início</button></div></div>' +
    '<main class="pagina"><h2>Quem tirou quem?</h2><p class="suave">Toque no ? para revelar cada amigo oculto.</p>' +
    '<div class="acoes" style="margin:12px 0 18px"><button class="btn" data-act="rev-proximo"' + (abertos >= total ? ' disabled' : '') + '>Revelar o próximo</button><button class="btn btn-borda" data-act="rev-todos"' + (abertos >= total ? ' disabled' : '') + '>Revelar todos</button></div>' +
    lista(R.amigos, 'a') + (R.inimigos.length ? '<h2 style="margin:28px 0 12px">Inimigos ocultos 😈</h2>' + lista(R.inimigos, 'i') : '') + '</main>';
}
function luzes() {
  var cores = ['#D2693A', '#FFC857', '#8DB86B', '#9CC77A'], k = 0, fio = 'M-10 6', bulbos = '';
  for (var i = 0; i < 4; i++) {
    var x0 = -10 + i * 110, x1 = x0 + 110, cx = x0 + 55, cy = 62;
    fio += ' Q' + cx + ' ' + cy + ' ' + x1 + ' 6';
    [0.17, 0.5, 0.83].forEach(function (t) {
      var x = (1 - t) * (1 - t) * x0 + 2 * t * (1 - t) * cx + t * t * x1;
      var y = (1 - t) * (1 - t) * 6 + 2 * t * (1 - t) * cy + t * t * 6;
      var cor = cores[k % 4], atraso = ((k * 0.43) % 2.6).toFixed(2);
      bulbos += '<g class="bulbo" style="animation-delay:' + atraso + 's"><rect x="' + (x - 2.5).toFixed(1) + '" y="' + (y - 1).toFixed(1) + '" width="5" height="7" rx="1" fill="#0F2016"/>' +
        '<ellipse cx="' + x.toFixed(1) + '" cy="' + (y + 12).toFixed(1) + '" rx="5.5" ry="7.5" fill="' + cor + '" style="filter:drop-shadow(0 0 5px ' + cor + ')"/></g>';
      k++;
    });
  }
  var um = '<svg class="luzes" viewBox="-10 0 440 62" aria-hidden="true"><path d="' + fio + '" fill="none" stroke="#0F2016" stroke-width="2"/>' + bulbos + '</svg>';
  return '<div class="luzes-faixa" aria-hidden="true">' + um + um + um + um + um + um + '</div>';
}

function muralHtml() {
  var e = S.eu, m = S.mural, h = '';
  h += '<div class="campo"><label for="pista-txt">Poste uma pista sobre o seu amigo oculto</label><textarea id="pista-txt" maxlength="140" placeholder="Sem dar o nome nem entregar demais"></textarea>' +
    '<p class="dica suave" id="dica-despiste" style="margin-top:6px">' + (S.despiste ? 'Esta pista descreve ' + esc(S.despiste.nome) + ', não o seu amigo. Ninguém vai saber qual pista é verdadeira.' : 'Você pode postar até ' + e.maxPistas + ' pistas (' + e.minhasPistas + ' postadas).') + '</p></div>' +
    '<div class="acoes" style="margin-bottom:22px"><button class="btn" data-act="postar-pista">Postar pista</button><button class="btn btn-borda btn-pequeno" data-act="usar-traco">Usar uma característica do meu amigo</button><button class="btn btn-borda btn-pequeno" data-act="despiste">Criar pista de despiste</button></div>';
  if (!m) return h + '<p class="suave">Carregando o mural...</p>';
  if (!m.pistas.length) return h + '<p>O mural ainda está vazio. Seja o primeiro a postar uma pista.</p>';
  var outros = e.participantes.filter(function (p) { return p.id !== e.eu.id; });
  h += '<h3 style="margin:8px 0 12px">Pistas dos participantes</h3>';
  h += m.pistas.map(function (p) {
    var sus = p.minha ? '' : '<div class="suspeitos"><span style="background:none;padding:0;font-weight:500">Escrita por um destes:</span>' + p.suspeitos.map(function (s) { return '<span><img src="' + esc(s.foto) + '" alt="">' + esc(primeiroNome(s.nome)) + '</span>'; }).join('') + '</div>';
    var acao = '';
    if (p.minha) acao = '<p class="suave" style="margin:0">Sua pista' + (p.alvo ? ', sobre ' + esc(p.alvo.nome) : '') + '.</p>';
    else if (p.palpite) acao = '<p class="' + (p.palpite.acertou ? 'resultado-certo' : 'resultado-errado') + '" style="margin:0">' + (p.palpite.acertou ? 'Você acertou!' : 'Não foi dessa vez.') + '</p>';
    else acao = '<div class="palpite"><label class="oculto" for="sel-' + p.id + '">Sobre quem é?</label><select id="sel-' + p.id + '"><option value="">Sobre quem é?</option>' + outros.map(function (o) { return '<option value="' + esc(o.id) + '">' + esc(o.nome) + '</option>'; }).join('') + '</select><button class="btn btn-pequeno" data-act="palpitar" data-id="' + esc(p.id) + '">Palpitar</button></div>';

    return '<div class="pista"><p class="texto">' + esc(p.texto) + '</p>' + sus + acao + rev + '</div>';
  }).join('');
  return h;
}

function admFesta() {
  var d = S.adm.dados, r = d.roubo, nomeDe = function (id) { var p = d.pessoas.filter(function (x) { return x.id === id; })[0]; return p ? p : { nome: '?', foto: '' }; };
  if (!r) {
    return '<section><h2>Roubo de presentes</h2><p>Cada pessoa leva um presente embrulhado. Você numera os embrulhos e usa esta tela na festa.</p>' +
      '<ul><li>Na sua vez, a pessoa abre um presente novo ou rouba um já aberto.</li><li>Quem foi roubado joga em seguida.</li><li>Cada presente pode ser roubado até 2 vezes, depois fica travado.</li><li>Não vale roubar de volta na mesma jogada.</li></ul>' +
      '<div class="acoes"><button class="btn btn-grande" data-act="adm-roubo-iniciar"' + (d.pessoas.length < 2 ? ' disabled' : '') + '>Sortear a ordem e começar</button></div></section>';
  }
  var vez = r.vezId ? nomeDe(r.vezId) : null, faltam = r.fila.length;
  var h = '<section><h2>Roubo de presentes</h2>';
  h += r.fim ? '<div class="vez"><b>Fim de jogo</b></div>' : '<div class="vez"><img src="' + esc(vez.foto) + '" alt=""><div>É a vez de<b>' + esc(vez.nome) + '</b></div></div><p class="suave" style="margin-top:8px">' + (faltam ? faltam + (faltam === 1 ? ' pessoa ainda não jogou.' : ' pessoas ainda não jogaram.') : 'Última jogada da rodada.') + '</p>';
  h += '<div class="tabuleiro">' + r.presentes.map(function (g) {
    var travado = g.roubos >= r.maxRoubos, dono = g.dono ? nomeDe(g.dono) : null;
    if (!g.dono) return '<div class="tile fechado"><span class="num">' + g.num + '</span><span>Embrulho fechado</span>' + (!r.fim ? '<button class="btn btn-lampada btn-pequeno" data-act="adm-roubo-abrir" data-n="' + g.num + '">Abrir</button>' : '') + '</div>';
    var pode = !r.fim && g.dono !== r.vezId && !travado && r.proibido !== g.num;
    return '<div class="tile' + (travado ? ' travado' : '') + '"><span class="num">' + g.num + '</span><b>' + esc(g.descricao) + '</b><span class="suave">Com ' + esc(primeiroNome(dono.nome)) + '</span>' +
      '<span class="tag-status">' + (travado ? 'Travado' : 'Roubado ' + g.roubos + 'x') + '</span>' + (!r.fim ? '<button class="btn btn-pequeno" data-act="adm-roubo-roubar" data-n="' + g.num + '"' + (pode ? '' : ' disabled') + '>Roubar</button>' : '') + '</div>';
  }).join('') + '</div>';
  if (r.log.length) h += '<h3 style="margin:18px 0 8px">O que aconteceu</h3><ul class="lista-simples">' + r.log.slice(0, 12).map(function (l) { return '<li><span>' + esc(l) + '</span></li>'; }).join('') + '</ul>';
  h += '<div class="acoes" style="margin-top:18px">' + (!r.fim ? '<button class="btn btn-borda btn-pequeno" data-act="adm-roubo-encerrar">Encerrar o jogo agora</button>' : '') + '<button class="btn btn-perigo btn-pequeno" data-act="adm-roubo-reiniciar">Recomeçar do zero</button></div></section>';
  return h;
}

function carregarImg(url, cb) {
  var im = IMGS[url];
  if (im && im.complete && im.naturalWidth) { cb(im); return; }
  if (!im) {
    im = new Image(); im._cbs = []; IMGS[url] = im;
    im.onload = function () { var l = im._cbs; im._cbs = []; l.forEach(function (f) { f(im); }); };
    im.src = url;
  }
  im._cbs.push(cb);
}

function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

// Tudo é desenhado dentro do círculo, porque os avatares do app são redondos.
function desenharMoldura(g, tipo, S) {
  var c = S / 2, TAU = Math.PI * 2;
  g.save();
  if (tipo === 'gorro') {
    g.translate(S * 0.5, S * 0.27); g.rotate(-0.22);
    g.fillStyle = '#B9522E'; g.beginPath(); g.moveTo(-S * 0.30, S * 0.08);
    g.quadraticCurveTo(-S * 0.20, -S * 0.15, S * 0.12, -S * 0.17); g.quadraticCurveTo(S * 0.28, -S * 0.08, S * 0.30, S * 0.08); g.closePath(); g.fill();
    g.fillStyle = 'rgba(0,0,0,.12)'; g.beginPath(); g.moveTo(S * 0.12, -S * 0.17); g.quadraticCurveTo(S * 0.28, -S * 0.08, S * 0.30, S * 0.08); g.lineTo(S * 0.16, S * 0.08); g.closePath(); g.fill();
    g.fillStyle = '#FFFFFF'; rr(g, -S * 0.34, S * 0.04, S * 0.68, S * 0.11, S * 0.055); g.fill();
    g.beginPath(); g.arc(S * 0.12, -S * 0.18, S * 0.062, 0, TAU); g.fill();
  } else if (tipo === 'luzes') {
    var gr = g.createRadialGradient(c, c, S * 0.30, c, c, S * 0.5);
    gr.addColorStop(0, 'rgba(15,32,22,0)'); gr.addColorStop(1, 'rgba(15,32,22,.55)'); g.fillStyle = gr; g.fillRect(0, 0, S, S);
    g.strokeStyle = '#0F2016'; g.lineWidth = S * 0.012; g.beginPath(); g.arc(c, c, S * 0.455, 0, TAU); g.stroke();
    var cores = ['#D2693A', '#FFC857', '#8DB86B', '#9CC77A'];
    for (var i = 0; i < 18; i++) {
      var a = i / 18 * TAU, x = c + Math.cos(a) * S * 0.455, y = c + Math.sin(a) * S * 0.455;
      g.fillStyle = cores[i % 4]; g.shadowColor = cores[i % 4]; g.shadowBlur = S * 0.05;
      g.beginPath(); g.arc(x, y, S * 0.036, 0, TAU); g.fill();
    }
  } else if (tipo === 'presente') {
    g.lineWidth = S * 0.075; g.strokeStyle = '#B9522E'; g.beginPath(); g.arc(c, c, S * 0.462, 0, TAU); g.stroke();
    g.lineWidth = S * 0.014; g.strokeStyle = '#FFC857'; g.beginPath(); g.arc(c, c, S * 0.462, 0, TAU); g.stroke();
    g.fillStyle = '#FFC857'; g.strokeStyle = '#C98A12'; g.lineWidth = S * 0.008;
    [-1, 1].forEach(function (s) {            // fitas caindo
      g.save(); g.translate(c, S * 0.115); g.rotate(s * 0.38);
      rr(g, -S * 0.024, 0, S * 0.048, S * 0.15, S * 0.011); g.fill(); g.stroke(); g.restore();
    });
    [-1, 1].forEach(function (s) {            // alças do laço, viradas para cima
      g.save(); g.translate(c, S * 0.115); g.rotate(-s * 0.4);
      g.beginPath(); g.ellipse(s * S * 0.08, 0, S * 0.072, S * 0.04, 0, 0, TAU); g.fill(); g.stroke();
      g.restore();
    });
    g.beginPath(); g.arc(c, S * 0.118, S * 0.032, 0, TAU); g.fill(); g.stroke();
  } else if (tipo === 'neve') {
    g.fillStyle = 'rgba(156,199,122,.16)'; g.fillRect(0, 0, S, S);
    g.fillStyle = '#FFFFFF'; g.beginPath(); g.moveTo(0, S); g.lineTo(0, S * 0.9);
    for (var k = 0; k < 6; k++) g.quadraticCurveTo(S * (k + 0.5) / 6, S * (k % 2 ? 0.80 : 0.85), S * (k + 1) / 6, S * 0.9);
    g.lineTo(S, S); g.closePath(); g.fill();
    var seed = 7, rnd = function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    g.fillStyle = 'rgba(255,255,255,.92)';
    for (var n = 0; n < 32; n++) {
      var fx = rnd() * S, fy = rnd() * S * 0.85, dx = fx - c, dy = fy - c;
      if (Math.sqrt(dx * dx + dy * dy) > S * 0.46) continue;
      g.beginPath(); g.arc(fx, fy, S * (0.006 + rnd() * 0.012), 0, TAU); g.fill();
    }
    g.strokeStyle = 'rgba(255,255,255,.95)'; g.lineWidth = S * 0.022; g.beginPath(); g.arc(c, c, S * 0.485, 0, TAU); g.stroke();
  }
  g.restore();
}

function desenharMolduras() {
  var cvs = document.querySelectorAll('canvas[data-moldura]');
  for (var i = 0; i < cvs.length; i++) (function (cv) {
    var obj = getPath(S, cv.dataset.moldura);
    if (!obj || !obj.fotoBase) return;
    carregarImg(obj.fotoBase, function (im) {
      var g = cv.getContext('2d'); g.clearRect(0, 0, cv.width, cv.height);
      g.drawImage(im, 0, 0, cv.width, cv.height); desenharMoldura(g, cv.dataset.tipo, cv.width);
    });
  })(cvs[i]);
}

function aplicarMoldura(prefix) {
  var obj = getPath(S, prefix);
  if (!obj.fotoBase) return;
  if (!obj.moldura || obj.moldura === 'nenhuma') { obj.foto = obj.fotoBase; render(); return; }
  carregarImg(obj.fotoBase, function (im) {
    var c = document.createElement('canvas'); c.width = c.height = 256;
    var g = c.getContext('2d'); g.drawImage(im, 0, 0, 256, 256); desenharMoldura(g, obj.moldura, 256);
    var q = 0.86, d = c.toDataURL('image/jpeg', q);
    while (d.length > 50000 && q > 0.4) { q -= 0.08; d = c.toDataURL('image/jpeg', q); }
    obj.foto = d; render();
  });
}

/* ---------------- rubrica (assinar ou desenhar) ---------------- */
function iniciarPads() {
  var cvs = document.querySelectorAll('canvas[data-pad]');
  for (var i = 0; i < cvs.length; i++) (function (cv) {
    if (cv._pronto) return; cv._pronto = true;
    var path = cv.dataset.pad, g = cv.getContext('2d'), desenhando = false, ultimo = null;
    g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
    g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = 5; g.strokeStyle = '#1F3A2B';
    var atual = getPath(S, path);
    if (atual) { var im = new Image(); im.onload = function () { g.drawImage(im, 0, 0, cv.width, cv.height); }; im.src = atual; }
    function pos(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; }
    function salvar() {
      var t = document.createElement('canvas'); t.width = 400; t.height = 147;
      var tg = t.getContext('2d'); tg.fillStyle = '#fff'; tg.fillRect(0, 0, 400, 147); tg.drawImage(cv, 0, 0, 400, 147);
      var d = t.toDataURL('image/png'); if (d.length > 55000) d = t.toDataURL('image/jpeg', 0.7);
      setPath(S, path, d);
    }
    cv.addEventListener('pointerdown', function (e) {
      e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (x) {}
      desenhando = true; ultimo = pos(e);
      g.fillStyle = '#1F3A2B'; g.beginPath(); g.arc(ultimo.x, ultimo.y, 2.5, 0, 6.3); g.fill();
    });
    cv.addEventListener('pointermove', function (e) {
      if (!desenhando) return; var p = pos(e);
      g.beginPath(); g.moveTo(ultimo.x, ultimo.y); g.lineTo(p.x, p.y); g.stroke(); ultimo = p;
    });
    function fim() { if (!desenhando) return; desenhando = false; salvar(); }
    cv.addEventListener('pointerup', fim); cv.addEventListener('pointercancel', fim); cv.addEventListener('pointerleave', fim);
  })(cvs[i]);
}

var raiz = document.getElementById('app');
function render() {
  var y = window.scrollY, html;
  S.demoBanner = API_URL ? '' : '<div class="faixa-demo">Modo demonstração: os dados ficam só neste navegador</div>';
  if (S.view === 'carregando') html = '<div class="carregando">Pendurando as luzes...</div>';
  else if (!S.pub) html = '<div class="carregando" style="padding:24px;text-align:center">Não consegui falar com o servidor.<br><button class="btn btn-lampada" style="margin-top:16px" data-act="recarregar">Tentar de novo</button></div>';
  else if (S.view === 'cadastro') html = telaCadastro();
  else if (S.view === 'eu' && S.eu) html = telaEu();
  else if (S.view === 'admin') html = telaAdmin();
  else if (S.view === 'revelacao' && S.rev) html = telaRevelacao();
  else html = telaAbertura();
  raiz.innerHTML = html;
  desenharMolduras(); iniciarPads();
  window.scrollTo(0, y);
}
function revChaves() { var R = S.rev, o = []; R.amigos.forEach(function (_, i) { o.push('a' + i); }); R.inimigos.forEach(function (_, i) { o.push('i' + i); }); return o; }
function revFim() { return revChaves().every(function (k) { return S.rev.abertos[k]; }); }
function irPara(v) { S.view = v; render(); window.scrollTo(0, 0); }

/* ---------------- carregamento ---------------- */
async function carregarPublico() { S.pub = await chamar('publico'); }
async function carregarEu(token) {
  S.eu = await chamar('eu', { token: token });
  S.token = token; lsSet('ao_token', token);
  S.ed = {
    perfil: { fotoBase: '', moldura: 'nenhuma', assinatura: S.eu.eu.assinatura || '', nome: S.eu.eu.nome, foto: S.eu.eu.foto, nascimento: S.eu.eu.nascimento, telefone: S.eu.eu.telefone, tracos: JSON.parse(JSON.stringify(S.eu.eu.tracos || {})) },
    presentes: [0, 1, 2].map(function (i) { var g = (S.eu.eu.presentes || [])[i]; return g ? { nome: g.nome, foto: g.foto, tamanho: g.tamanho, link: g.link } : { nome: '', foto: '', tamanho: '', link: '' }; })
  };
}
async function carregarMural() { S.mural = await chamar('mural', { token: S.token }); }
async function carregarAdmin() {
  S.adm.dados = await chamar('adminDados', { pin: S.adm.pin });
  S.adm.cfg = JSON.parse(JSON.stringify(S.adm.dados.config));
}

async function iniciar() {
  var qs = new URLSearchParams(location.search);
  var t = qs.get('t') || lsGet('ao_token') || '';
  try { await carregarPublico(); } catch (e) { S.pub = null; S.erroInicial = e.message; }
  S.view = 'abertura';
  if (S.pub && qs.has('admin')) { await abrirAdmin(); return; }
  if (S.pub && qs.has('revelacao')) {
    try { S.rev = await chamar('revelacao'); S.rev.abertos = {}; S.view = 'revelacao'; render(); return; }
    catch (e) { aviso(e.message, true); }
  }
  if (S.pub && t) {
    try { await carregarEu(t); S.view = 'eu'; S.tab = 'amigo'; if (qs.get('t')) history.replaceState(null, '', location.pathname); }
    catch (e) { lsSet('ao_token', ''); if (qs.get('t')) aviso(e.message, true); }
  }
  render();
}

async function abrirAdmin() {
  var est = await chamar('adminEstado');
  S.adm.temPin = est.temPin; S.adm.dados = null; S.adm.pin = '';
  irPara('admin');
}

function novoCad() { return { step: 1, nome: '', foto: '', fotoBase: '', moldura: 'nenhuma', assinatura: '', nascimento: '', telefone: '', email: '', tracos: {}, presentes: [0, 1, 2].map(function () { return { nome: '', foto: '', tamanho: '', link: '' }; }) }; }

function validarPasso1() {
  var c = S.cad;
  if (!c.foto) return 'Escolha uma foto sua.';
  if (c.nome.trim().length < 2) return 'Digite seu nome.';
  if (!c.nascimento) return 'Informe seu aniversário.';
  if (digitos(c.telefone).length < 8) return 'Informe um telefone com DDD.';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(c.email.trim())) return 'Informe um e-mail válido.';
  return '';
}

function agendaIcs() {
  var ev = S.eu.config.evento, d = ev.data.replace(/-/g, ''), hh = ev.hora.replace(':', '');
  var fim = ('0' + Math.min(23, parseInt(ev.hora.slice(0, 2), 10) + 4)).slice(-2) + ev.hora.slice(3);
  var ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Amigo Oculto//PT', 'BEGIN:VEVENT', 'UID:' + Date.now() + '@amigo-oculto',
    'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z', 'DTSTART:' + d + 'T' + hh + '00', 'DTEND:' + d + 'T' + fim.replace(':', '') + '00',
    'SUMMARY:' + S.eu.config.titulo, 'LOCATION:' + (ev.local + ' - ' + ev.endereco).replace(/[,;]/g, ' '), 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })); a.download = 'amigo-oculto.ics';
  document.body.appendChild(a); a.click(); a.remove();
}

  'adm-modo': function (el) {
    var v = el.checked;
    return rodar(async function () { await chamar('adminConfig', { pin: S.adm.pin, config: { modos: { inimigo: v } } }); await carregarAdmin(); render(); aviso(v ? 'Inimigo oculto ativado.' : 'Inimigo oculto desativado.'); });
  },
  'adm-revelar': function (el) {
    var v = el.checked;
    return rodar(async function () { await chamar('adminRevelar', { pin: S.adm.pin, valor: v }); await carregarAdmin(); render(); aviso(v ? 'Mural revelado.' : 'Mural voltou a esconder os autores.'); });
  },
  'adm-zap': function (el) {
    var p = S.adm.dados.pessoas.filter(function (x) { return x.id === el.dataset.id; })[0], f = digitos(p.telefone);
    if (f.length <= 11) f = '55' + f;
    var msg = 'Oi, ' + primeiroNome(p.nome) + '! Seu link pessoal do ' + S.adm.dados.config.titulo + ': ' + p.link + '\nNão encaminhe para ninguém, ou a surpresa vai embora.';
    if (!p.link) { aviso('Defina o endereço do app em Configurações primeiro.', true); return; }
    window.open('https://wa.me/' + f + '?text=' + encodeURIComponent(msg), '_blank', 'noopener');
  },
  'adm-reenviar': function (el) { return rodar(async function () { await chamar('adminReenviar', { pin: S.adm.pin, id: el.dataset.id }); aviso('Link reenviado por e-mail.'); }); },
  'adm-copiar': function (el) {
    var p = S.adm.dados.pessoas.filter(function (x) { return x.id === el.dataset.id; })[0];
    if (!p.link) { aviso('Defina o endereço do app em Configurações primeiro.', true); return; }
    if (navigator.clipboard) navigator.clipboard.writeText(p.link).then(function () { aviso('Link copiado.'); }, function () { aviso(p.link); }); else aviso(p.link);
  },
  'adm-remover': async function (el) {
    var p = S.adm.dados.pessoas.filter(function (x) { return x.id === el.dataset.id; })[0];
    if (!(await confirmar('Remover ' + p.nome + '?', 'O cadastro será apagado.', 'Remover', true))) return;
    return rodar(async function () { await chamar('adminRemover', { pin: S.adm.pin, id: el.dataset.id }); await carregarAdmin(); render(); aviso('Participante removido.'); });
  },
  'adm-usar-url': function () { S.adm.cfg.appUrl = location.origin + location.pathname; render(); },
  'tirar-capa': function () { S.adm.cfg.capa = ''; render(); },
  'adm-salvar-config': function () {
    var f = S.adm.cfg;
    return rodar(async function () {
      await chamar('adminConfig', { pin: S.adm.pin, config: { titulo: f.titulo, saudacao: f.saudacao, notaFoto: f.notaFoto, organizador: f.organizador, dataSorteio: f.dataSorteio, valorSugerido: f.valorSugerido, appUrl: f.appUrl, capa: f.capa, evento: f.evento } });
      await carregarPublico(); await carregarAdmin(); render(); aviso('Configurações salvas.');
    });
  },
  'adm-roubo-iniciar': function () { return rodar(async function () { await chamar('adminRouboIniciar', { pin: S.adm.pin }); await carregarAdmin(); render(); }); },
  'adm-roubo-abrir': async function (el) {
    var n = el.dataset.n, desc = await pedirTexto('Abrindo o embrulho ' + n, 'O que veio dentro?', 'text');
    if (desc === null) return;
    return rodar(async function () { await chamar('adminRouboAgir', { pin: S.adm.pin, tipo: 'abrir', num: n, descricao: desc }); await carregarAdmin(); render(); });
  },
  'adm-roubo-roubar': function (el) { return rodar(async function () { await chamar('adminRouboAgir', { pin: S.adm.pin, tipo: 'roubar', num: el.dataset.n }); await carregarAdmin(); render(); }); },
  'adm-roubo-encerrar': function () { return rodar(async function () { await chamar('adminRouboEncerrar', { pin: S.adm.pin }); await carregarAdmin(); render(); }); },
  'adm-roubo-reiniciar': async function () {
    if (!(await confirmar('Recomeçar o roubo de presentes?', 'O andamento atual será apagado.', 'Recomeçar', true))) return;
    return rodar(async function () { await chamar('adminRouboReiniciar', { pin: S.adm.pin }); await carregarAdmin(); render(); });
  },
  'demo-semear': function () {
    var s = demoLoad(); if (s.ordem.length) { aviso('Zere a demonstração antes de preencher com exemplos.', true); return; }
    AO.semearDemo(s, demoCtx); demoSave(s);
    return rodar(async function () { await carregarPublico(); await carregarAdmin(); render(); aviso('7 participantes de exemplo criados.'); });
  },
  'demo-zerar': async function () {
    if (!(await confirmar('Zerar a demonstração?', 'Todos os dados deste navegador serão apagados.', 'Zerar', true))) return;
    lsSet('ao_demo', ''); lsSet('ao_demo_mail', '[]'); lsSet('ao_token', ''); S.eu = null; S.token = '';
    return rodar(async function () { await carregarPublico(); await abrirAdmin(); });
  }
};

/* ---------------- eventos ---------------- */
document.addEventListener('click', function (ev) {
  var chip = ev.target.closest('[data-chip]');
  if (chip) {
    var obj = getPath(S, chip.dataset.chip), k = chip.dataset.k, v = chip.dataset.v;
    if (obj[k] === v) delete obj[k]; else obj[k] = v;
    var irmaos = chip.parentNode.querySelectorAll('[data-chip]');
    for (var i = 0; i < irmaos.length; i++) irmaos[i].setAttribute('aria-pressed', String(obj[irmaos[i].dataset.k] === irmaos[i].dataset.v));
    return;
  }
  var el = ev.target.closest('[data-act]');
  if (!el || el.tagName === 'INPUT') return;
  var fn = ACOES[el.dataset.act];
  if (fn) { var r = fn(el); if (r && r.catch) r.catch(function (e) { aviso(e.message, true); }); }
});

document.addEventListener('change', async function (ev) {
  var el = ev.target;
  if (el.matches('input[type=checkbox][data-act]')) { var fn = ACOES[el.dataset.act]; if (fn) { var r = fn(el); if (r && r.catch) r.catch(function (e) { aviso(e.message, true); }); } return; }
  if (el.matches('input[type=file][data-foto]')) {
    var f = el.files && el.files[0]; if (!f) return;
    try {
      var url = await lerFoto(f, el.dataset.tipo);
      if (el.dataset.tipo === 'avatar') { var pre = el.dataset.foto.replace(/\.foto$/, ''), ob = getPath(S, pre); ob.fotoBase = url; ob.moldura = 'nenhuma'; ob.foto = url; }
      else setPath(S, el.dataset.foto, url);
      render();
    } catch (e) { aviso(e.message, true); }
  }
});

document.addEventListener('input', function (ev) {
  var el = ev.target;
  if (el.dataset && el.dataset.b) setPath(S, el.dataset.b, el.value);
});

document.addEventListener('submit', function (ev) {
  if (ev.target.id !== 'form-admin') return;
  ev.preventDefault();
  var pin = $('#adm-pin').value;
  rodar(async function () {
    if (S.adm.temPin === false) { await chamar('adminCriarPin', { pin: pin }); S.adm.temPin = true; }
    S.adm.pin = pin;
    try { await carregarAdmin(); } catch (e) { S.adm.pin = ''; $('#erro-adm').textContent = e.message; return; }
    S.adm.aba = 'painel'; render();
  });
});

iniciar();
})();
</script>
